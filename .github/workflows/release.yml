name: Release Minote Importer

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build and package
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci
          npm run build
          plugin_id=$(node -p "require('./manifest.json').id")
          plugin_version=$(node -p "require('./manifest.json').version")
          test "$GITHUB_REF_NAME" = "$plugin_version"
          mkdir "$plugin_id"
          cp main.js manifest.json LICENSE "$plugin_id/"
          archive="$plugin_id-$plugin_version.zip"
          zip -r "$archive" "$plugin_id"
          echo "PLUGIN_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "$PLUGIN_ARCHIVE" main.js manifest.json LICENSE --verify-tag --title "$GITHUB_REF_NAME"
